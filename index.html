<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#236b39">
<title>Προετοιμασία Εξετάσεων Μαθηματικών</title>
<style>
:root{--g:#236b39;--gd:#164b2a;--bg:#f4f0e4;--card:#fffdf8;--mut:#70756b;--red:#b62e23;--ok:#2b8050}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#192019;font-family:Georgia,"Times New Roman",serif}.app{max-width:820px;margin:auto;padding:14px}.screen{display:none}.screen.on{display:block}.hero{position:relative;overflow:hidden;min-height:390px;border-radius:30px;padding:36px;color:#fff;background:radial-gradient(circle at 64% 25%,#dfb54f 0 56px,#dfb54f33 57px 92px,transparent 93px),repeating-linear-gradient(112deg,#ffffff0b 0 3px,transparent 3px 32px),linear-gradient(150deg,#2b7a43,#164b2a);box-shadow:0 7px 22px #0002}.hero small{font:800 24px system-ui;color:#f0c35d}.hero h1{font-size:58px;line-height:1.02;margin:27px 0 18px}.hero p{font:22px/1.45 system-ui;margin:0;max-width:650px}.art{position:absolute;right:30px;bottom:20px;font-size:84px;opacity:.15}.menu{display:grid;gap:16px;margin-top:22px}.card{width:100%;border:1px solid #ded9cc;background:var(--card);border-radius:25px;padding:22px 24px;box-shadow:0 6px 18px #00000016;display:grid;grid-template-columns:70px 1fr 25px;align-items:center;gap:16px;text-align:left;color:inherit;cursor:pointer}.ico{width:64px;height:64px;border-radius:19px;background:#e7f0e4;display:grid;place-items:center;font:30px system-ui;color:var(--g)}.card b{font-size:29px}.card span{display:block;font:18px/1.35 system-ui;color:var(--mut);margin-top:4px}.arr{font:36px system-ui;color:#667265}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.stat{background:var(--card);border:1px solid #ded9cc;border-radius:22px;padding:18px 7px;text-align:center;box-shadow:0 5px 15px #0001}.stat b{display:block;font-size:42px}.stat span{font:700 15px system-ui;color:var(--mut)}.stat.red b{color:var(--red)}.reset{display:block;margin:24px auto;border:0;background:transparent;text-decoration:underline;color:#677066;font-size:18px;cursor:pointer}.sheet{background:var(--card);border:1px solid #ddd8cb;border-radius:26px;min-height:620px;padding:23px;box-shadow:0 7px 20px #0002}.top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.back,.pill{border:0;border-radius:13px;padding:10px 14px;font:800 15px system-ui}.back{background:#e8efe5;color:#254b31;cursor:pointer}.pill{background:#edf3e9;color:#405744}.section h2{font-size:36px;margin:28px 0 8px}.section p{font:18px system-ui;color:var(--mut)}.secgrid{display:grid;gap:12px;margin-top:20px}.sec{border:2px solid #dbe2d7;background:#f8fbf6;border-radius:17px;padding:17px;text-align:left;font-weight:800;font-size:23px;cursor:pointer}.sec small{display:block;font:15px system-ui;color:var(--mut);margin-top:4px}.progress{height:9px;background:#e4e7df;border-radius:99px;overflow:hidden;margin:21px 0 10px}.progress div{height:100%;background:var(--g);width:0}.meta{font:800 15px system-ui;color:var(--mut)}.q{font-size:27px;line-height:1.38;font-weight:900;margin:22px 0}.answers{display:grid;gap:11px}.ans{width:100%;border:2px solid #d8ddd3;background:#fff;border-radius:16px;padding:15px 16px;text-align:left;font-size:19px;line-height:1.35;cursor:pointer}.ans.sel{border-color:#79a184;background:#f2f7ef}.ans.ok{border-color:var(--ok);background:#e8f5ec}.ans.bad{border-color:var(--red);background:#faeae7}.feed{min-height:36px;margin:14px 0;font:800 17px system-ui}.nav{display:flex;justify-content:space-between;gap:10px}.nav button{border:0;border-radius:13px;padding:12px 16px;font-weight:900;cursor:pointer}.prev{background:#e8ece4}.next{background:var(--g);color:#fff}.result{text-align:center;padding:45px 8px}.score{font-size:72px;font-weight:900;color:var(--g)}.result p{font:19px system-ui;color:var(--mut)}.result button{border:0;border-radius:14px;background:var(--g);color:white;padding:13px 18px;font-weight:900;cursor:pointer}.musicBtn{position:fixed;right:16px;bottom:16px;z-index:50;border:1px solid #d8d3c8;background:#fffdf8;color:#23502f;border-radius:999px;padding:11px 15px;box-shadow:0 5px 18px #0002;font:800 15px system-ui;cursor:pointer}.music{display:none;position:fixed;left:10px;right:10px;bottom:10px;z-index:60;max-width:520px;margin:auto;background:#fffdf8;border:1px solid #d8d3c8;border-radius:18px;padding:10px;box-shadow:0 8px 25px #0003}.music.show{display:block}.mhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font:800 13px system-ui;color:#244f30;margin-bottom:8px}.mhead button{border:0;border-radius:999px;width:29px;height:29px;cursor:pointer}.music iframe{width:100%;height:352px;border:0;border-radius:13px;background:#111}@media(max-width:620px){.hero{min-height:330px;padding:27px 22px}.hero small{font-size:18px}.hero h1{font-size:44px}.hero p{font-size:18px}.art{font-size:65px}.card{grid-template-columns:58px 1fr 18px;padding:18px;gap:11px}.ico{width:54px;height:54px;font-size:25px}.card b{font-size:24px}.card span{font-size:15px}.stat b{font-size:34px}.stat span{font-size:12px}.sheet{padding:17px}.q{font-size:22px}.ans{font-size:17px}.music iframe{height:300px}}
</style>
</head>
<body>
<div class="app">
<section id="home" class="screen on">
<div class="hero"><small>Μαθηματικά</small><h1>Προετοιμασία<br>εξετάσεων</h1><p>5 ερωτήσεις · Άλγεβρα (1–3) · Γεωμετρία (4–5)</p><div class="art">x²</div></div>
<div class="menu">
<button class="card" onclick="sections()"><div class="ico">▣</div><div><b>Εξάσκηση</b><span>Άμεση διόρθωση, με τη σειρά ή ανά ενότητα.</span></div><div class="arr">›</div></button>
<button class="card" onclick="exam()"><div class="ico">⏱</div><div><b>Προσομοίωση εξέτασης</b><span>Τυχαίες ερωτήσεις, χρονόμετρο και βαθμολογία στο τέλος.</span></div><div class="arr">›</div></button>
<button class="card" onclick="weak()"><div class="ico">◎</div><div><b>Αδύναμες ερωτήσεις</b><span>Επανάληψη μόνο σε όσα έχεις κάνει λάθος.</span></div><div class="arr">›</div></button>
</div>
<div class="stats"><div class="stat"><b id="seen">0</b><span>έχεις δει</span></div><div class="stat"><b id="pct">0%</b><span>σωστές</span></div><div class="stat red"><b id="weak">0</b><span>αδύναμες</span></div></div>
<button class="reset" onclick="resetStats()">Μηδενισμός στατιστικών</button>
</section>
<section id="sections" class="screen"><div class="sheet section"><div class="top"><button class="back" onclick="home()">← Αρχική</button><div class="pill">Εξάσκηση</div></div><h2>Διάλεξε ενότητα</h2><p>Όλες οι ερωτήσεις ή μία ενότητα.</p><div class="secgrid"><button class="sec" onclick="practice('all')">Όλες οι ερωτήσεις<small>5 ερωτήσεις</small></button><button class="sec" onclick="practice('Άλγεβρα')">Άλγεβρα<small>3 ερωτήσεις</small></button><button class="sec" onclick="practice('Γεωμετρία')">Γεωμετρία<small>2 ερωτήσεις</small></button></div></div></section>
<section id="quiz" class="screen"><div class="sheet" id="sheet"><div class="top"><button class="back" onclick="home()">← Αρχική</button><div id="mode" class="pill">Εξάσκηση</div><div id="timer" class="pill" style="display:none">05:00</div></div><div class="progress"><div id="bar"></div></div><div id="meta" class="meta"></div><div id="q" class="q"></div><div id="answers" class="answers"></div><div id="feed" class="feed"></div><div class="nav"><button id="prev" class="prev" onclick="prev()">← Προηγούμενη</button><button id="next" class="next" onclick="next()">Επόμενη →</button></div></div></section>
</div>
<button class="musicBtn" onclick="toggleMusic()">🎵 Τζοκόντα</button>
<div id="music" class="music"><div class="mhead"><span>🎵 Μάνος Χατζιδάκις · Το Χαμόγελο της Τζοκόντας · Spotify</span><button onclick="toggleMusic()">×</button></div><iframe src="https://open.spotify.com/embed/album/1jbdDkcUBivFykH4sBARwL?utm_source=generator&theme=0" title="Το Χαμόγελο της Τζοκόντας στο Spotify" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe></div>
<script>
const Q=[
{s:'Άλγεβρα',q:'Ποιο από τα παρακάτω αναπτύγματα ισχύει για το τετράγωνο αθροίσματος (α + β)²;',a:['α² − β²','α² + β²','α² + 2αβ + β²','α² − 2αβ + β²'],c:2},
{s:'Άλγεβρα',q:'Η εξίσωση αx² + βx + γ = 0 με α ≠ 0 έχει διπλή ρίζα αν η διακρίνουσα Δ είναι:',a:['Δ > 0','Δ < 0','Δ = 0','Δ ≥ 0'],c:2},
{s:'Άλγεβρα',q:'Η παραγοντοποίηση του πολυωνύμου x² − 9 είναι:',a:['(x − 3)²','(x − 3)(x + 3)','(x + 3)²','x(x − 9)'],c:1},
{s:'Γεωμετρία',q:'Σε ένα ορθογώνιο τρίγωνο με οξεία γωνία ω, το ημίτονο sin(ω) ισούται με:',a:['προσκείμενη κάθετη πλευρά / υποτείνουσα','απέναντι κάθετη πλευρά / προσκείμενη κάθετη πλευρά','απέναντι κάθετη πλευρά / υποτείνουσα','υποτείνουσα / απέναντι κάθετη πλευρά'],c:2},
{s:'Γεωμετρία',q:'Ο λόγος του εμβαδού δύο όμοιων τριγώνων με λόγο ομοιότητας λ είναι:',a:['λ','λ²','2λ','√λ'],c:1}
],L=['Α','Β','Γ','Δ'];let type='practice',queue=[],i=0,given={},locked={},tid=null,start=0;const $=x=>document.getElementById(x);
function st(){return JSON.parse(localStorage.getItem('mathStats')||'{"seen":{},"attempts":0,"right":0,"wrong":{}}')}
function save(s){localStorage.setItem('mathStats',JSON.stringify(s))}
function stats(){let s=st();$('seen').textContent=Object.keys(s.seen||{}).length;$('pct').textContent=s.attempts?Math.round(100*s.right/s.attempts)+'%':'0%';$('weak').textContent=Object.values(s.wrong||{}).filter(x=>x>0).length}
function record(qi,ok){let s=st();s.seen=s.seen||{};s.wrong=s.wrong||{};s.seen[qi]=1;s.attempts++;if(ok){s.right++;if(s.wrong[qi])s.wrong[qi]=Math.max(0,s.wrong[qi]-1)}else s.wrong[qi]=(s.wrong[qi]||0)+1;save(s);stats()}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');scrollTo(0,0)}
function home(){clearInterval(tid);show('home');stats()}function sections(){show('sections')}function sh(a){return [...a].sort(()=>Math.random()-.5)}
function practice(sec){type='practice';queue=Q.map((x,k)=>k).filter(k=>sec==='all'||Q[k].s===sec);i=0;given={};locked={};$('mode').textContent=sec==='all'?'Εξάσκηση · Όλα':'Εξάσκηση · '+sec;$('timer').style.display='none';show('quiz');render()}
function weak(){let s=st();queue=Q.map((x,k)=>k).filter(k=>(s.wrong?.[k]||0)>0);if(!queue.length)return alert('Δεν υπάρχουν ακόμη αδύναμες ερωτήσεις. Κάνε πρώτα εξάσκηση.');type='practice';i=0;given={};locked={};$('mode').textContent='Αδύναμες';$('timer').style.display='none';show('quiz');render()}
function exam(){type='exam';queue=sh(Q.map((x,k)=>k));i=0;given={};locked={};$('mode').textContent='Προσομοίωση';$('timer').style.display='';start=Date.now();clearInterval(tid);tid=setInterval(tick,1000);tick();show('quiz');render()}
function tick(){let left=Math.max(0,300-Math.floor((Date.now()-start)/1000));$('timer').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');if(!left){clearInterval(tid);finish()}}
function render(){let qi=queue[i],q=Q[qi];$('bar').style.width=((i+1)/queue.length*100)+'%';$('meta').textContent=q.s+' · Ερώτηση '+(i+1)+' από '+queue.length;$('q').textContent=q.q;$('answers').innerHTML='';$('feed').textContent='';q.a.forEach((t,k)=>{let b=document.createElement('button');b.className='ans';b.textContent=L[k]+') '+t;if(given[qi]===k)b.classList.add('sel');if(type==='practice'&&locked[qi]){if(k===q.c)b.classList.add('ok');if(k===given[qi]&&k!==q.c)b.classList.add('bad')}b.onclick=()=>choose(k);$('answers').appendChild(b)});if(type==='practice'&&locked[qi])$('feed').textContent=given[qi]===q.c?'✅ Σωστό!':'❌ Λάθος. Σωστό: '+L[q.c]+') '+q.a[q.c];$('prev').disabled=i===0;$('next').textContent=i===queue.length-1?'Τέλος':'Επόμενη →'}
function choose(k){let qi=queue[i],q=Q[qi];if(type==='practice'&&locked[qi])return;given[qi]=k;if(type==='practice'){locked[qi]=1;record(qi,k===q.c)}render()}function prev(){if(i>0){i--;render()}}function next(){if(i<queue.length-1){i++;render()}else type==='exam'?finish():home()}
function finish(){clearInterval(tid);let right=0,answered=0;queue.forEach(qi=>{if(given[qi]!==undefined){answered++;let ok=given[qi]===Q[qi].c;if(ok)right++;record(qi,ok)}});$('sheet').innerHTML='<div class="result"><h2>Αποτέλεσμα εξέτασης</h2><div class="score">'+right+'/'+queue.length+'</div><p><b>'+Math.round(100*right/queue.length)+'%</b> σωστές απαντήσεις</p><p>Απάντησες '+answered+' από '+queue.length+'.</p><button onclick="location.reload()">Επιστροφή στην αρχική</button></div>'}
function resetStats(){if(confirm('Να μηδενιστούν όλα τα στατιστικά;')){localStorage.removeItem('mathStats');stats()}}function toggleMusic(){$('music').classList.toggle('show')}
document.addEventListener('keydown',e=>{if(!$('quiz').classList.contains('on'))return;if(['1','2','3','4'].includes(e.key))choose(+e.key-1);if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev()});stats();
</script>
</body></html>
