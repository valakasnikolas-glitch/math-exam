name: Update math exam site

on:
  push:
    paths:
      - '.github/workflows/update-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add questions and change music
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          additional = r'''  {s:'Άλγεβρα',q:'Το ανάπτυγμα του (α + β)² είναι:',a:['α² + β²','α² + 2αβ + β²','α² − 2αβ + β²','α² − β²'],c:1},
          {s:'Άλγεβρα',q:'Το ανάπτυγμα του (α − β)² είναι:',a:['α² − β²','α² + 2αβ + β²','α² − 2αβ + β²','α² + β²'],c:2},
          {s:'Άλγεβρα',q:'Η ταυτότητα α² − β² ισούται με:',a:['(α − β)²','(α − β)(α + β)','(α + β)²','α(α − β)'],c:1},
          {s:'Άλγεβρα',q:'Η παραγοντοποίηση του x² − 25 είναι:',a:['(x − 5)²','(x − 5)(x + 5)','(x + 5)²','x(x − 25)'],c:1},
          {s:'Άλγεβρα',q:'3x + 2x − 4 ισούται με:',a:['5x − 4','6x − 4','5x + 4','x − 4'],c:0},
          {s:'Άλγεβρα',q:'Η λύση της εξίσωσης 2x + 5 = 17 είναι:',a:['5','6','7','11'],c:1},
          {s:'Άλγεβρα',q:'Η λύση της εξίσωσης 3(x − 2) = x + 4 είναι:',a:['2','3','4','5'],c:3},
          {s:'Άλγεβρα',q:'Το γινόμενο (x + 2)(x − 2) είναι:',a:['x² − 4','x² + 4','x² − 4x + 4','x² + 4x + 4'],c:0},
          {s:'Άλγεβρα',q:'Αν x = 2, η τιμή του x² − 3x + 1 είναι:',a:['−1','0','1','3'],c:0},
          {s:'Άλγεβρα',q:'Η διακρίνουσα της εξίσωσης x² − 4x + 4 = 0 είναι:',a:['−4','0','4','16'],c:1},
          {s:'Άλγεβρα',q:'Η εξίσωση x² − 5x + 6 = 0 έχει ρίζες:',a:['1 και 6','2 και 3','−2 και −3','3 και 6'],c:1},
          {s:'Άλγεβρα',q:'Αν Δ > 0, μια εξίσωση 2ου βαθμού έχει:',a:['καμία πραγματική ρίζα','μία διπλή ρίζα','δύο διαφορετικές πραγματικές ρίζες','άπειρες ρίζες'],c:2},
          {s:'Άλγεβρα',q:'Αν Δ = 0, μια εξίσωση 2ου βαθμού έχει:',a:['δύο διαφορετικές ρίζες','μία διπλή ρίζα','καμία ρίζα','άπειρες ρίζες'],c:1},
          {s:'Άλγεβρα',q:'Το σύστημα x + y = 7 και x − y = 1 έχει λύση:',a:['(3, 4)','(4, 3)','(5, 2)','(2, 5)'],c:1},
          {s:'Άλγεβρα',q:'Για τη συνάρτηση y = 2x + 1, όταν x = 3, τότε y =:',a:['5','6','7','8'],c:2},
          {s:'Άλγεβρα',q:'Ο συντελεστής διεύθυνσης της ευθείας y = −3x + 5 είναι:',a:['5','−5','3','−3'],c:3},
          {s:'Άλγεβρα',q:'Αν y = 4x και x = 2,5, τότε y =:',a:['6','8','10','12'],c:2},
          {s:'Άλγεβρα',q:'√81 ισούται με:',a:['8','9','18','81'],c:1},
          {s:'Άλγεβρα',q:'Ο βαθμός του πολυωνύμου 3x⁴ − 2x + 1 είναι:',a:['2','3','4','5'],c:2},
          {s:'Άλγεβρα',q:'Για να ορίζεται το κλάσμα 3/(x − 2), πρέπει:',a:['x = 2','x ≠ 2','x > 2','x < 2'],c:1},
          {s:'Γεωμετρία',q:'Σε ορθογώνιο τρίγωνο, sin(ω) είναι:',a:['προσκείμενη / υποτείνουσα','απέναντι / υποτείνουσα','απέναντι / προσκείμενη','υποτείνουσα / απέναντι'],c:1},
          {s:'Γεωμετρία',q:'Σε ορθογώνιο τρίγωνο, cos(ω) είναι:',a:['προσκείμενη / υποτείνουσα','απέναντι / υποτείνουσα','απέναντι / προσκείμενη','υποτείνουσα / προσκείμενη'],c:0},
          {s:'Γεωμετρία',q:'Σε ορθογώνιο τρίγωνο, tan(ω) είναι:',a:['απέναντι / προσκείμενη','προσκείμενη / υποτείνουσα','απέναντι / υποτείνουσα','υποτείνουσα / απέναντι'],c:0},
          {s:'Γεωμετρία',q:'Ορθογώνιο τρίγωνο έχει κάθετες πλευρές 6 και 8. Η υποτείνουσα είναι:',a:['9','10','12','14'],c:1},
          {s:'Γεωμετρία',q:'Σε ορθογώνιο τρίγωνο με υποτείνουσα 13 και μία κάθετη πλευρά 5, η άλλη κάθετη πλευρά είναι:',a:['8','10','12','18'],c:2},
          {s:'Γεωμετρία',q:'Δύο όμοια τρίγωνα έχουν λόγο ομοιότητας 3. Ο λόγος των εμβαδών τους είναι:',a:['3','6','9','27'],c:2},
          {s:'Γεωμετρία',q:'Αν δύο τρίγωνα είναι όμοια, οι αντίστοιχες γωνίες τους είναι:',a:['παραπληρωματικές','ίσες','κάθετες','διπλάσιες'],c:1},
          {s:'Γεωμετρία',q:'Το άθροισμα των γωνιών ενός τριγώνου είναι:',a:['90°','180°','270°','360°'],c:1},
          {s:'Γεωμετρία',q:'Σε ορθογώνιο τρίγωνο, αν οι κάθετες πλευρές είναι 3 και 4, η υποτείνουσα είναι:',a:['5','6','7','8'],c:0},
          {s:'Γεωμετρία',q:'Αν δύο όμοια τρίγωνα έχουν λόγο αντίστοιχων πλευρών λ, ο λόγος των εμβαδών τους είναι:',a:['λ','2λ','λ²','√λ'],c:2}'''
          if '35 ερωτήσεις · Άλγεβρα (23) · Γεωμετρία (12)' not in s:
              marker="\n],L=['Α','Β','Γ','Δ'];"
              if marker not in s:
                  raise SystemExit('Question-array marker not found')
              s=s.replace(marker,',\n'+additional+marker,1)
          s=s.replace('5 ερωτήσεις · Άλγεβρα (1–3) · Γεωμετρία (4–5)','35 ερωτήσεις · Άλγεβρα (23) · Γεωμετρία (12)')
          s=s.replace('Όλες οι ερωτήσεις<small>5 ερωτήσεις</small>','Όλες οι ερωτήσεις<small>35 ερωτήσεις</small>')
          s=s.replace('Άλγεβρα<small>3 ερωτήσεις</small>','Άλγεβρα<small>23 ερωτήσεις</small>')
          s=s.replace('Γεωμετρία<small>2 ερωτήσεις</small>','Γεωμετρία<small>12 ερωτήσεις</small>')
          s=s.replace('>05:00</div>','>30:00</div>')
          s=s.replace('300-Math.floor','1800-Math.floor')
          s=s.replace('🎵 Τζοκόντα','🎵 Believer')
          s=s.replace('🎵 Μάνος Χατζιδάκις · Το Χαμόγελο της Τζοκόντας · Spotify','🎵 Imagine Dragons · Believer · Spotify')
          s=s.replace('https://open.spotify.com/embed/album/1jbdDkcUBivFykH4sBARwL?utm_source=generator&theme=0','https://open.spotify.com/embed/track/0pqnGHJpmpxLKifKRmU6WP?utm_source=generator&theme=0')
          s=s.replace('Μάνος Χατζιδάκις - Το Χαμόγελο της Τζοκόντας στο Spotify','Imagine Dragons - Believer στο Spotify')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit updated site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Add 30 questions and switch music to Believer'
          git push
